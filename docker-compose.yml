services:
  app:
    build:
      context: .
      target: dev-runner
    command: bun run dev
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
      - ./bot.private-key.pem:/app/bot.private-key.pem:ro
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_ACCESS_TOKEN=${TWITCH_ACCESS_TOKEN}
      - TWITCH_REFRESH_TOKEN=${TWITCH_REFRESH_TOKEN}
      - MODRINTH_PAT=${MODRINTH_PAT}
      - CURSEFORGE_TOKEN=${CURSEFORGE_TOKEN}
      - SQLITE_PATH=${SQLITE_PATH:-data/bot.db}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID}
      - GITHUB_APP_PRIVATE_KEY_FILE=/app/bot.private-key.pem
      - GITHUB_WEBHOOK_PORT=${GITHUB_WEBHOOK_PORT:-8787}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - DB_FILE_NAME=${DB_FILE_NAME}
      - TZ=America/Los_Angeles
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./tsconfig.json
